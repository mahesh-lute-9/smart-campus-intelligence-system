{# Reusable Modal Component #}
{% macro modal(id="", title="", content="", actions="", size="") %}
<div id="{{ id }}" class="modal" role="dialog" aria-labelledby="{{ id }}-title" aria-hidden="true">
  <div class="modal-content {% if size %}modal-{{ size }}{% endif %}">
    <div class="modal-header">
      <h5 id="{{ id }}-title">{{ title }}</h5>
      <button 
        type="button" 
        class="modal-close" 
        onclick="document.getElementById('{{ id }}').classList.remove('active');"
        aria-label="Close modal"
      >
        ✕
      </button>
    </div>
    
    <div class="modal-body">
      {{ content | safe }}
    </div>
    
    {% if actions %}
    <div class="modal-footer">
      {{ actions | safe }}
    </div>
    {% endif %}
  </div>
</div>

<script>
  (function() {
    const modal = document.getElementById('{{ id }}');
    if (!modal) return;
    
    // Close on background click
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
      }
    });
    
    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        modal.classList.remove('active');
      }
    });
    
    // Expose methods for external control
    window.showModal = function(modalId) {
      const m = document.getElementById(modalId);
      if (m) m.classList.add('active');
    };
    
    window.closeModal = function(modalId) {
      const m = document.getElementById(modalId);
      if (m) m.classList.remove('active');
    };
  })();
</script>
{% endmacro %}
