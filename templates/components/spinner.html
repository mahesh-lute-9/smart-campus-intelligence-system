{# Reusable Spinner Component #}
{% macro spinner(size="md", text="Loading...") %}
<div class="d-flex align-center gap-2" style="justify-content: center;">
  <div class="spinner {% if size == 'sm' %}spinner-sm{% elif size == 'lg' %}spinner-lg{% endif %}"></div>
  {% if text %}
    <span class="text-muted">{{ text }}</span>
  {% endif %}
</div>
{% endmacro %}

{# Full Page Loader #}
{% macro page_loader(id="page-loader") %}
<div id="{{ id }}" style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  display: none;
">
  <div class="text-center">
    <div class="spinner" style="width: 2rem; height: 2rem; margin-bottom: var(--spacing-lg);"></div>
    <p class="text-muted">Loading...</p>
  </div>
</div>

<script>
  window.showPageLoader = function() {
    const loader = document.getElementById('{{ id }}');
    if (loader) loader.style.display = 'flex';
  };
  
  window.hidePageLoader = function() {
    const loader = document.getElementById('{{ id }}');
    if (loader) loader.style.display = 'none';
  };
</script>
{% endmacro %}
